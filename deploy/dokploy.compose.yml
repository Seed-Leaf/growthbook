services:
  mongo:
    image: ${MONGO_IMAGE:?Set a pinned MongoDB image}
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: growthbook
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set a MongoDB password}
    volumes:
      - mongodata:/data/db
    mem_limit: 2g
    cpus: 1
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.getSiblingDB('admin').auth(process.env.MONGO_INITDB_ROOT_USERNAME, process.env.MONGO_INITDB_ROOT_PASSWORD); if (db.adminCommand({ping:1}).ok !== 1) quit(1)"
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  growthbook:
    image: ${GROWTHBOOK_IMAGE:?Set the fork image digest}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_ORIGIN: https://growthbook.moulder.dev
      API_HOST: https://growthbook-api.moulder.dev
      MONGODB_URI: mongodb://growthbook:${MONGO_PASSWORD:?Set a MongoDB password}@mongo:27017/growthbook?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?Set a stable JWT secret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set a stable encryption key}
      SSO_CONFIG: ${SSO_CONFIG:?Set Google OIDC configuration}
      SSO_GOOGLE_WORKSPACE_DOMAINS: moulder.ai
      UPLOAD_METHOD: local
      EXPRESS_TRUST_PROXY_OPTS: "1"
      GB_STATS_ENGINE_POOL_SIZE: "2"
      GB_STATS_ENGINE_MIN_POOL_SIZE: "0"
      NODE_OPTIONS: --max-old-space-size=1536
    volumes:
      - uploads:/usr/local/src/app/packages/back-end/uploads
    mem_limit: 4g
    cpus: 2
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "Promise.all(['http://127.0.0.1:3100/healthcheck','http://127.0.0.1:3000/'].map(async u => { const r = await fetch(u, {signal: AbortSignal.timeout(5000)}); if (!r.ok) throw new Error('unhealthy'); })).then(() => process.exit(0), () => process.exit(1))"
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  mongodata:
  uploads:
